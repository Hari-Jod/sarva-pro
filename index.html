<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stay Safe - Women Security App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Stay Safe Women Security App</h1>
</header>

<nav>
    <ul>
        <li><a href="#scream">Scream Alarm</a></li>
        <li><a href="#fakecall">Fake Call</a></li>
        <li><a href="#track">Track Me</a></li>
        <li><a href="#friends">Friends</a></li>
        <li><a href="#settings">Settings</a></li>
        <li><a href="#sos">SOS</a></li>
    </ul>
</nav>

<section id="scream" class="card">
    <h2>Scream Alarm</h2>
    <p>Select an alarm sound:</p>
    <button>Male Scream</button>
    <button>Police Siren</button>
</section>

<section id="fakecall" class="card">
    <h2>Fake Call Timer</h2>
    <input type="text" placeholder="Enter Caller Name">
    <input type="number" placeholder="Set Timer (seconds)">
    <button>Start Fake Call</button>
</section>

<section id="track" class="card">
    <h2>Track Me</h2>
    <button>Share My Location</button>
    <button>View Friend Location</button>
</section>

<section id="friends" class="card">
    <h2>Friends List</h2>
    <ul>
        <li>Mom</li>
        <li>Dad</li>
        <li>Best Friend</li>
    </ul>
    <button>Add Contact</button>
</section>

<section id="settings" class="card">
    <h2>Settings</h2>
    <label><input type="checkbox"> Enable Emergency Services</label><br>
    <label><input type="checkbox"> Low Battery Alert</label><br>
    <label>Select Scream Sound:</label>
    <select>
        <option>Male Voice</option>
        <option>Police Siren</option>
    </select>
</section>

<section id="sos" class="card">
    <h2>Emergency SOS</h2>
    <p>Shake phone or press button</p>
    <button class="sos-btn">SEND SOS</button>
</section>

<footer>
    <p>© 2026 Stay Safe App</p>
</footer>

</body>
</html>
